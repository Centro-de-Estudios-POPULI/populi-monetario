<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#C71E1D">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monetización de la Deuda Pública · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Monetización de la Deuda Pública</div>
      <div class="sec-sub">Crédito neto del BCB al SPNF como porcentaje del activo total del BCB</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Rango</span><div class="hz-grp" id="b-rango"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando datos de monetización…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Análisis de monetización</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C;
    // En tema oscuro las empresas públicas (petróleo) suben a menta: el petróleo queda bajo 3:1 contra la tarjeta (validado).
    var SERIES = [
      { k: 'total_pct', nombre: 'Créd. neto SPNF / Activo', corto: 'Créd. neto total', color: C.rojo, ancho: 2.5, forma: 'linea', area: true },
      { k: 'gc_pct', nombre: 'Gob. central / Activo', corto: 'Gob. central', color: C.oro, ancho: 1.75, forma: 'linea' },
      { k: 'rib_pct', nombre: 'Reservas / Activo', corto: 'Reservas (RIB)', color: C.turquesa, ancho: 1.75, forma: 'linea' },
      { k: 'ep_pct', nombre: 'Emp. públicas / Activo', corto: 'Emp. públicas', color: { claro: C.petroleo, oscuro: C.menta }, ancho: 1.75, forma: 'punteada' }
    ];
    var COL = { total_pct: SERIES[0].color, gc_pct: SERIES[1].color, rib_pct: SERIES[2].color, ep_pct: SERIES[3].color };
    var estado = { rango: 'desde2010', idx: null };
    var activas = new Set(['total_pct', 'gc_pct', 'rib_pct']);
    var G, K, si = 0, grafico;
    // índice del último dato no nulo (el punto final va ahí, no en un hueco)
    var ultimoDato = function (data) { var n = data.length - 1; while (n > 0 && data[n] == null) n--; return n; };
    var bs = function (v) { return PM.num(v, 0) + ' MM Bs'; };

    // Crédito neto del BCB al SPNF (monetizacion_deuda.json) sobre el activo total del BCB (activo_bcb.json), mes a mes
    function unir(deuda, activo) {
      var porMes = {};
      activo.series.forEach(function (a) { porMes[a.date] = a; });
      var out = [];
      deuda.series.forEach(function (d) {
        var a = porMes[d.date];
        if (!a || !a.total_activo) return;
        var ta = a.total_activo, r1 = function (x) { return Math.round(x / ta * 1000) / 10; };
        out.push({ date: d.date, total_pct: r1(d.total_neto), gc_pct: r1(d.gc_neto), ep_pct: r1(d.ep_neto), rib_pct: r1(a.rib),
          total_neto: d.total_neto, gc_neto: d.gc_neto, total_activo: ta, rib: a.rib });
      });
      return out;
    }

    PM.cargar(['monetizacion_deuda.json', 'activo_bcb.json']).then(function (r) {
      G = unir(r[0], r[1]);
      K = G.map(function (x) { return x.date; }); estado.idx = G.length - 1;
      PM.botonera(document.getElementById('b-rango'), [['5a', '5 años'], ['desde2010', 'Desde 2010'], ['desde2000', 'Desde 2000'], ['todo', 'Todo']],
        estado.rango, function (v) { estado.rango = v; grafico.redibujar(); });
      PM.pastillas(document.getElementById('pastillas'),
        SERIES.map(function (s) { return { k: s.k, nombre: s.corto, color: s.color, forma: s.forma }; }),
        activas, function () { grafico.redibujar(); });
      cifras();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      grafico.chart.on('click', function (p) { if (p.dataIndex != null) panel(si + p.dataIndex); });
      panel(estado.idx);
      PM.alCambiarTema(function () { cifras(); panel(estado.idx); });
      PM.preguntas(document.getElementById('preguntas'), PREGUNTAS);
      document.getElementById('fuente').innerHTML = 'Fuente: <a href="https://www.bcb.gob.bo/?q=content/sector-monetario" target="_blank" rel="noopener">BCB</a> · Elaboración: Centro de Estudios POPULI · Datos al: ' + PM.fecha(G[G.length - 1].date);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    function cifras() {
      var u = G[G.length - 1];
      var serie = function (k) { return PM.ultimos(G.map(function (x) { return x[k]; }), 24); };   // últimos 24 meses de cada razón
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: COL.total_pct, rotulo: 'Créd. neto SPNF / Activo', valor: PM.pct(u.total_pct, 1), delta: u.total_pct > 50 ? 'Dominancia fiscal' : 'Moderado', tono: u.total_pct > 50 ? 'malo' : 'neutro', serie: serie('total_pct') }) +
        PM.kpi({ color: COL.gc_pct, rotulo: 'Gob. central / Activo', valor: PM.pct(u.gc_pct, 1), delta: 'Principal deudor', tono: 'neutro', serie: serie('gc_pct') }) +
        PM.kpi({ color: COL.rib_pct, rotulo: 'Reservas (RIB) / Activo', valor: PM.pct(u.rib_pct, 1), delta: u.rib_pct < 20 ? 'Bajo respaldo' : 'Respaldo externo', tono: u.rib_pct < 20 ? 'malo' : 'neutro', serie: serie('rib_pct') }) +
        PM.kpi({ color: COL.ep_pct, rotulo: 'Emp. públicas / Activo', valor: PM.pct(u.ep_pct, 1), delta: 'YPFB, ENDE, etc.', tono: 'neutro', serie: serie('ep_pct') });
    }

    function opciones() {
      si = PM.desde(K, estado.rango);
      var V = G.slice(si), KV = K.slice(si), dk = PM.dk();
      var series = SERIES.filter(function (c) { return activas.has(c.k); }).map(function (c, j) {
        var data = V.map(function (x) { return x[c.k]; }), u = ultimoDato(data);
        var o = PM.linea(c.color, { ancho: c.ancho, punteada: c.forma === 'punteada', extra: {
          name: c.nombre, data: data, connectNulls: true, z: 5 - j, markPoint: PM.puntoFinal(c.color, u, data[u])
        } });
        // sólo la protagonista (crédito neto total) lleva relleno
        if (c.area) o.areaStyle = { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: PM.rgba(c.color, dk ? 0.16 : 0.1) }, { offset: 1, color: PM.rgba(c.color, 0) }]) };
        return o;
      });
      // El cero (si la serie lo cruza) y el umbral del 50%: más de la mitad del activo del BCB prestado al fisco
      var hayNeg = V.some(function (x) { return x.total_pct < 0 || x.gc_pct < 0; });
      if (series.length) {
        var cero = PM.cero(), marcas = [];
        if (hayNeg) marcas.push({ yAxis: 0, lineStyle: cero.lineStyle, label: { show: false } });
        // umbral: punteado de 1,25 px en pizarra, como toda referencia
        marcas.push({ yAxis: 50, lineStyle: { color: PM.var('--pizarra'), width: 1.25, type: 'dashed' },
          label: { show: true, formatter: '50% — Dominancia fiscal', position: 'insideStartTop', fontFamily: PM.inter(), fontSize: 9.5, fontWeight: 600, color: PM.var('--pizarra'),
            textBorderColor: PM.var('--card') || '#fff', textBorderWidth: 3 } });
        series[0].markLine = { silent: true, symbol: 'none', animation: false, data: marcas };
      }
      var el = document.getElementById('chart');
      return {
        grid: PM.grid({ top: 16 }),
        xAxis: PM.ejeTiempo(KV, el),
        yAxis: PM.ejeY({ fmt: 'pct' }),
        tooltip: PM.tooltip(function (ps) {
          if (!ps.length) return '';
          var i = ps[0].dataIndex;
          panel(si + i);
          var h = PM.ttTitulo(PM.fecha(KV[i]));
          ps.forEach(function (p) {
            if (p.value == null) return;
            var c = SERIES.filter(function (q) { return q.nombre === p.seriesName; })[0];
            h += PM.ttFila(c.color, c.nombre, PM.pct(p.value, 1), c.forma);
          });
          return h;
        }),
        series: series
      };
    }

    function panel(i) {
      if (i == null || !G || !G[i]) return;
      estado.idx = i;
      var d = G[i], txt;
      if (d.total_pct > 70) txt = 'El crédito al SPNF absorbe <strong>' + PM.pct(d.total_pct, 1) + '</strong> del activo del BCB: <strong>dominancia fiscal extrema</strong>. Las reservas apenas cubren <strong>' + PM.pct(d.rib_pct, 1) + '</strong>. El banco central está funcionalmente subordinado al fisco.';
      else if (d.total_pct > 50) txt = '<strong>' + PM.pct(d.total_pct, 1) + '</strong> del activo es crédito al gobierno. <strong>Dominancia fiscal clara</strong>: la política monetaria depende de las necesidades de financiamiento del Estado.';
      else if (d.total_pct > 0) txt = 'Crédito neto al SPNF en <strong>' + PM.pct(d.total_pct, 1) + '</strong> del activo. Nivel <strong>moderado</strong> de monetización, con reservas en <strong>' + PM.pct(d.rib_pct, 1) + '</strong>.';
      else txt = 'Crédito neto <strong>negativo (' + PM.pct(d.total_pct, 1) + ')</strong>: el gobierno tiene más depósitos que préstamos en el BCB, es decir, es <strong>acreedor neto</strong> del banco central. Situación posterior a las reformas estructurales de 1985, cuando el Estado mantenía superávits y depósitos que excedían su endeudamiento con el BCB.';
      document.getElementById('panel-fecha').textContent = PM.fecha(d.date);
      document.getElementById('panel').innerHTML =
        PM.pb(COL.total_pct, 'Créd. neto SPNF / Activo', PM.pct(d.total_pct, 1),
          'Crédito neto: <strong>' + bs(d.total_neto) + '</strong> de un activo total de <strong>' + bs(d.total_activo) + '</strong>.') +
        PM.pb(COL.gc_pct, 'Gobierno central / Activo', PM.pct(d.gc_pct, 1)) +
        PM.pb(COL.rib_pct, 'Reservas (RIB) / Activo', PM.pct(d.rib_pct, 1)) +
        PM.ctx(txt);
    }

    var PREGUNTAS = [
      ['¿Qué mide este indicador?', 'Muestra qué <strong>porcentaje del activo del BCB</strong> corresponde a crédito al gobierno. Si supera el 50%, más de la mitad del balance del banco central son préstamos al sector público: señal de <strong>dominancia fiscal</strong>.'],
      ['RIB vs. crédito: la tijera', 'Cuando el crédito al SPNF sube y las reservas bajan, se forma una <strong>«tijera»</strong>: el BCB sustituye activos de calidad (divisas) por deuda del gobierno. Este deterioro compromete la capacidad de defender el tipo de cambio.'],
      ['¿Cuándo es peligroso?', 'No existe un umbral universal, pero cuando el crédito neto al SPNF supera el <strong>60-70%</strong> del activo total, la política monetaria pierde autonomía efectiva y la inflación depende más de la política fiscal que de las decisiones del banco central.'],
      ['La deuda pública como respaldo monetario', 'El <strong>respaldo monetario por antonomasia desde el siglo XX ha sido la deuda pública</strong>. Sin embargo, una cantidad excesiva de deuda pública junto a su monetización es la principal causa de la aparición de la inflación en la última centuria. Cuando la demanda de deuda pública se concentra en el banco central, la inflación se dispara.'],
      ['Mecanismo de la monetización', 'La monetización ocurre cuando el BCB compra deuda del gobierno, inyectando dinero nuevo a la economía. A diferencia de cuando un privado compra bonos (transfiere dinero existente), cuando el banco central lo hace <strong>crea dinero nuevo</strong>. Este es el canal directo entre <strong>déficit fiscal e inflación</strong>: mayor gasto público financiado con emisión deteriora el valor de la moneda.']
    ];
  })();
  </script>
</body>
</html>
