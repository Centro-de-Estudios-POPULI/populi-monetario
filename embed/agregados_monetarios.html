<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#A86E00">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agregados Monetarios · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Agregados Monetarios</div>
      <div class="sec-sub">Tasa de crecimiento interanual (12 meses) de M1, M2, M3 y M4</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Rango</span><div class="hz-grp" id="b-rango"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando agregados monetarios…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C;
    // En tema oscuro M2 (petróleo) sube a menta y M1 (granate) a rojo: los dos quedan bajo 3:1 contra la tarjeta (validado).
    var SERIES = [
      { k: 'm4', nombre: 'M4', largo: 'M4 (liquidez total)', color: C.oro, ancho: 2.5 },
      { k: 'm3', nombre: 'M3', largo: 'M3', color: C.turquesa, ancho: 1.75 },
      { k: 'm2', nombre: 'M2', largo: 'M2', color: { claro: C.petroleo, oscuro: C.menta }, ancho: 1.75 },
      { k: 'm1', nombre: 'M1', largo: 'M1 (medio circulante)', color: { claro: C.granate, oscuro: C.rojo }, ancho: 2 }
    ];
    var estado = { rango: 'desde2010', idx: null };
    // Las cuatro tasas se mueven casi juntas y se enredaban: por defecto, dinero en sentido estricto
    // (M1) contra amplio (M4); M2 y M3 quedan a un clic en sus pastillas.
    var activas = new Set(['m1', 'm4']);
    var DATA, G, K, si = 0, grafico;
    // índice del último dato no nulo (el punto final va ahí, no en un hueco)
    var ultimoDato = function (data) { var n = data.length - 1; while (n > 0 && data[n] == null) n--; return n; };

    // Crecimiento a 12 meses de cada agregado, calculado desde los saldos del BCB
    // (contra el mismo mes del año anterior, buscado por fecha: la serie arranca con un dato anual, dic-1987,
    // antes de los mensuales, y por posición S[i - 12] caía 23 meses atrás)
    function crecimiento() {
      var S = DATA.series, porFecha = {}; G = [];
      S.forEach(function (x) { porFecha[x.date] = x; });
      S.forEach(function (a) {
        var b = porFecha[(+a.date.slice(0, 4) - 1) + a.date.slice(4)];
        if (!b) return;
        var g = { date: a.date };
        ['m1', 'm2', 'm3', 'm4'].forEach(function (k) { g[k] = b[k] > 0 && a[k] != null ? Math.round((a[k] / b[k] - 1) * 1000) / 10 : null; });
        G.push(g);
      });
    }
    // Para el lector de un monitor monetario, una expansión alta de la liquidez es una señal de alerta
    function nivel(v) { return v > 10 ? ['Expansión alta', 'malo'] : v > 0 ? ['Crecimiento moderado', 'neutro'] : ['Contracción', 'neutro']; }

    PM.cargar(['agregados_monetarios.json']).then(function (r) {
      DATA = r[0]; crecimiento();
      K = G.map(function (x) { return x.date; }); estado.idx = G.length - 1;
      PM.botonera(document.getElementById('b-rango'), [['5a', '5 años'], ['desde2010', 'Desde 2010'], ['desde2000', 'Desde 2000'], ['todo', 'Todo']],
        estado.rango, function (v) { estado.rango = v; grafico.redibujar(); });
      PM.pastillas(document.getElementById('pastillas'),
        SERIES.map(function (s) { return { k: s.k, nombre: s.nombre, color: s.color, forma: 'linea' }; }),
        activas, function () { grafico.redibujar(); });
      cifras();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      grafico.chart.on('click', function (p) { if (p.dataIndex != null) panel(si + p.dataIndex); });
      panel(estado.idx);
      PM.alCambiarTema(function () { cifras(); panel(estado.idx); });
      PM.preguntas(document.getElementById('preguntas'), PREGUNTAS);
      document.getElementById('fuente').innerHTML = 'Fuente: <a href="https://www.bcb.gob.bo/?q=content/sector-monetario" target="_blank" rel="noopener">BCB</a> · Elaboración: Centro de Estudios POPULI · Datos al: ' + PM.fecha(DATA.metadata.ultimo_dato);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    function cifras() {
      var u = G[G.length - 1];
      document.getElementById('kpis').innerHTML = SERIES.map(function (s) {
        var nv = nivel(u[s.k]);
        return PM.kpi({ color: s.color, rotulo: 'Crec. ' + s.nombre + ' (12 m)', valor: PM.pct(u[s.k], 1, true), delta: nv[0], tono: nv[1],
          serie: PM.ultimos(G.map(function (x) { return x[s.k]; }), 24) });
      }).join('');
    }

    function opciones() {
      si = PM.desde(K, estado.rango);
      var V = G.slice(si), KV = K.slice(si), n = V.length - 1, hayNeg = false;
      var series = SERIES.filter(function (c) { return activas.has(c.k); }).map(function (c) {
        var data = V.map(function (x) { if (x[c.k] != null && x[c.k] < 0) hayNeg = true; return x[c.k]; }), u = ultimoDato(data);
        return PM.linea(c.color, { ancho: c.ancho, extra: {
          name: c.nombre, data: data, connectNulls: true, z: c.k === 'm4' ? 4 : c.k === 'm1' ? 3 : 2,
          markPoint: PM.puntoFinal(c.color, u, data[u])
        } });
      });
      if (hayNeg && series.length) series[0].markLine = PM.cero();   // el cero, más firme que la grilla
      var el = document.getElementById('chart');
      return {
        grid: PM.grid({ top: 16 }),
        xAxis: PM.ejeTiempo(KV, el),
        yAxis: PM.ejeY({ fmt: 'pct' }),
        tooltip: PM.tooltip(function (ps) {
          if (!ps.length) return '';
          var i = ps[0].dataIndex;
          panel(si + i);
          var h = PM.ttTitulo(PM.fecha(KV[i]));
          ps.forEach(function (p) {
            if (p.value == null) return;
            var c = SERIES.filter(function (q) { return q.nombre === p.seriesName; })[0];
            h += PM.ttFila(c.color, c.nombre, PM.pct(p.value, 1, true), 'linea');
          });
          return h;
        }),
        series: series
      };
    }

    function panel(i) {
      if (i == null || !G || !G[i]) return;
      estado.idx = i;
      var d = G[i], g = d.m4, txt;
      if (g > 20) txt = 'M4 crece <strong>' + PM.pct(g, 1) + '</strong>: <strong>expansión acelerada</strong> de la liquidez, muy por encima del crecimiento económico. Presión inflacionaria significativa.';
      else if (g > 10) txt = 'M4 crece <strong>' + PM.pct(g, 1) + '</strong>, un ritmo <strong>elevado</strong>. La liquidez se expande más rápido que lo que absorbe la actividad económica.';
      else if (g > 0) txt = 'M4 crece <strong>' + PM.pct(g, 1) + '</strong>, un ritmo <strong>moderado</strong>, potencialmente consistente con el crecimiento nominal de la economía.';
      else txt = 'M4 se <strong>contrae ' + PM.pct(Math.abs(g), 1) + '</strong>. La liquidez disminuye: restricción monetaria o caída de depósitos.';
      document.getElementById('panel-fecha').textContent = PM.fecha(d.date);
      document.getElementById('panel').innerHTML = SERIES.map(function (s) {
        return PM.pb(s.color, s.largo, PM.pct(d[s.k], 1, true), 'Crecimiento interanual (12 meses)');
      }).join('') + PM.ctx(txt);
    }

    var PREGUNTAS = [
      ['¿Qué son los agregados monetarios?', 'Los <strong>agregados monetarios</strong> miden la cantidad total de dinero en la economía: <strong>M1</strong> = billetes + depósitos a la vista; <strong>M2</strong> = M1 + caja de ahorro en MN; <strong>M3</strong> = M2 + plazo fijo en MN; <strong>M4</strong> = M3 + depósitos en ME. La tasa de crecimiento muestra cuánto aumenta la liquidez.'],
      ['¿Por qué importa el crecimiento?', 'Si los agregados crecen más rápido que el PIB nominal, el exceso de liquidez genera presión inflacionaria. Tasas superiores al 15-20% son señal de expansión monetaria agresiva.'],
      ['M1 vs. M4: señal de confianza', 'Cuando M1 crece más rápido que M4, la gente prefiere liquidez inmediata (señal de incertidumbre). Cuando M4 crece más, los depósitos a plazo y en ME aumentan (mayor confianza o dolarización).'],
      ['Teoría cuantitativa: de la base a los precios', 'Según la <strong>teoría cuantitativa del dinero</strong> (MV = PY), los agregados monetarios están directamente relacionados con el nivel de precios. <strong>M2</strong> muestra de forma más precisa la oferta monetaria en manos del público: dinero que puede ejercer presión sobre los precios. Las decisiones del BCB solo tienen efecto <strong>indirecto</strong> en M2, M3 y M4, a diferencia de la base monetaria.'],
      ['M3 y M4: profundización financiera', '<strong>M3</strong> amplía M2 al incluir depósitos a plazo y otros instrumentos del sector privado no financiero: es un indicador más completo de los recursos disponibles en el sistema. <strong>M4</strong> es el agregado más amplio e incluye activos financieros altamente líquidos fuera del sistema bancario tradicional. Refleja la totalidad del dinero que podría influir en la actividad económica y los precios.']
    ];
  })();
  </script>
</body>
</html>
