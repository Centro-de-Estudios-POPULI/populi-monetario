<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#C71E1D">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Determinantes de la Base Monetaria · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Determinantes de la Base Monetaria</div>
      <div class="sec-sub">Fuentes de creación de dinero primario (cuadro oficial del BCB). Base monetaria = billetes y monedas + reservas bancarias</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Medida</span><div class="hz-grp" id="b-medida"></div></div>
      <div class="hz-item"><span class="hz-lbl">Rango</span><div class="hz-grp" id="b-rango"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando los determinantes de la base monetaria…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
        <div class="panel-ft">
          <a href="../index.html" target="_blank" rel="noopener" class="amp">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            Ampliar análisis
          </a>
        </div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C;
    // Sólo llevan color la tesis: las reservas (turquesa) y el crédito al sector público (rojo).
    // El rojo va primero en el apilado (regla 7 de la marca): queda apoyado en el cero de los dos
    // lados, también antes de 2018, cuando el crédito al sector público era negativo. El resto, en
    // grises fríos de la marca: la OMA el más firme, lo residual el más tenue. Validado en los dos temas.
    // sign = +1 expansivo (suma a la base), −1 contractivo (se resta de la base)
    var COMPS = [
      { k: 'cred_sp', nombre: 'Crédito neto al sector público', corto: 'Créd. sector público', color: C.rojo, sign: 1 },
      { k: 'rin', nombre: 'Reservas int. netas (RIN)', corto: 'Reservas (RIN)', color: C.turquesa, sign: 1 },
      { k: 'cred_bancos', nombre: 'Crédito a bancos', corto: 'Créd. a bancos', color: { claro: C.tenue, oscuro: '#3A4549' }, sign: 1 },
      { k: 'oma', nombre: 'OMA (regulación monetaria)', corto: 'OMA', color: { claro: C.gris, oscuro: '#6E7A7D' }, sign: -1 },
      { k: 'otras', nombre: 'Otras cuentas (neto)', corto: 'Otras cuentas', color: { claro: '#DFE5EA', oscuro: '#242C30' }, sign: 1 }
    ];
    // El tooltip lee la identidad en su orden: RIN + crédito al SP + crédito a bancos − OMA + otras = base
    var IDENTIDAD = ['rin', 'cred_sp', 'cred_bancos', 'oma', 'otras'];
    var BASE = C.tinta;
    var comp = function (k) { return COMPS.filter(function (c) { return c.k === k; })[0]; };
    var estado = { medida: 'nivel', rango: 'desde2010', idx: null };
    var activas = new Set(['cred_sp', 'rin', 'cred_bancos', 'oma', 'otras', 'base']);
    var S, M, K, si = 0, grafico;
    var bs = function (v) { return PM.mm(v, 'Bs'); };
    var conSigno = function (v) { return (v > 0 ? '+' : '') + PM.auto(v); };

    PM.cargar(['determinantes_base.json']).then(function (r) {
      S = r[0].series; M = r[0].metadata; estado.idx = S.length - 1;
      K = S.map(function (x) { return x.date; });
      PM.botonera(document.getElementById('b-medida'), [['nivel', 'Nivel (MM Bs)'], ['share', '% de la base']],
        estado.medida, function (v) { estado.medida = v; grafico.redibujar(); });
      PM.botonera(document.getElementById('b-rango'), [['5a', '5 años'], ['desde2010', 'Desde 2010'], ['desde2005', 'Desde 2005'], ['todo', 'Todo']],
        estado.rango, function (v) { estado.rango = v; grafico.redibujar(); });
      PM.pastillas(document.getElementById('pastillas'),
        COMPS.map(function (c) { return { k: c.k, nombre: c.corto, color: c.color, forma: 'area' }; })
          .concat([{ k: 'base', nombre: 'Base monetaria', color: BASE, forma: 'linea' }]),
        activas, function () { grafico.redibujar(); });
      cifras();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      grafico.chart.on('click', function (p) { if (p.dataIndex != null) panel(si + p.dataIndex); });
      panel(estado.idx);
      PM.alCambiarTema(function () { cifras(); panel(estado.idx); });
      PM.preguntas(document.getElementById('preguntas'), preguntas());
      document.getElementById('fuente').innerHTML = 'Fuente: <a href="https://www.bcb.gob.bo/?q=content/sector-monetario" target="_blank" rel="noopener">BCB — Base Monetaria, Determinantes y Componentes</a> · Elaboración: Centro de Estudios POPULI · Datos al: ' + PM.fecha(M.ultimo_dato);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    function cifras() {
      var n = S.length, u = S[n - 1], a12 = S[n - 13] || S[0];
      var var12 = (u.base / a12.base - 1) * 100, shRin = u.rin / u.base * 100, shSp = u.cred_sp / u.base * 100;
      var cResp = shRin < 40 ? C.rojo : shRin < 100 ? C.oro : C.turquesa;
      // minilíneas: los últimos 24 meses de la misma magnitud (saldo o, en el respaldo, la razón RIN/base)
      var serie = function (f) { return PM.ultimos(S.map(f), 24); };
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: BASE, rotulo: 'Base monetaria', valor: bs(u.base), delta: PM.pct(var12, 1, true) + ' en 12 meses', tono: var12 > 10 ? 'malo' : var12 > 0 ? 'neutro' : 'bueno', serie: serie(function (x) { return x.base; }) }) +
        PM.kpi({ color: C.turquesa, rotulo: 'Reservas int. netas', valor: bs(u.rin), delta: PM.pct(shRin, 0) + ' de la base', tono: 'neutro', serie: serie(function (x) { return x.rin; }) }) +
        PM.kpi({ color: C.rojo, rotulo: 'Créd. neto sector público', valor: bs(u.cred_sp), delta: PM.pct(shSp, 0) + ' de la base', tono: 'malo', serie: serie(function (x) { return x.cred_sp; }) }) +
        PM.kpi({ color: cResp, rotulo: 'Respaldo en reservas', valor: PM.pct(shRin, 1), delta: 'RIN / base monetaria', tono: shRin < 100 ? 'malo' : 'bueno', serie: serie(function (x) { return x.base ? x.rin / x.base * 100 : null; }) });
    }

    // contribución de un componente a la base (con su signo); en % = sobre la base
    function aporte(x, c, share) {
      var v = c.sign * x[c.k];
      return share ? (x.base ? v / x.base * 100 : 0) : v;
    }

    function opciones() {
      si = PM.desde(K, estado.rango);
      var V = S.slice(si), KV = K.slice(si), dk = PM.dk(), share = estado.medida === 'share';
      // Barras apiladas (no áreas): los componentes cruzan el cero (el crédito al SP a fines de 2017)
      // y las áreas apiladas dejan huecos en esos cruces. Las barras apilan positivos hacia arriba y
      // negativos hacia abajo de forma exacta; con barCategoryGap 0% se tocan y simulan un área llena.
      // Cada componente va en DOS series: su parte positiva en la pila de arriba y la negativa en la de
      // abajo. Así cada pila es de un solo signo, como el apilado por signo de ECharts, y admite el modo
      // `large` (un solo relleno por serie): barra por barra, el antialiasing de los bordes fraccionarios
      // dejaba una costura clara cada pocos píxeles, y el modo `large` no respeta el apilado por signo.
      var series = [];
      COMPS.forEach(function (c) {
        if (!activas.has(c.k)) return;
        var vals = V.map(function (x) { return +aporte(x, c, share).toFixed(2); });
        [['arriba', function (v) { return v > 0 ? v : 0; }], ['abajo', function (v) { return v < 0 ? v : 0; }]].forEach(function (lado) {
          series.push(PM.barra(c.color, { extra: {
            // barGap -100%: las dos pilas comparten la columna del mes (si no, ECharts las pone lado a lado)
            name: c.nombre, stack: lado[0], barCategoryGap: '0%', barGap: '-100%', z: 1, large: true, largeThreshold: 1,
            data: vals.map(lado[1])
          } }));
        });
      });
      if (series.length) series[0].markLine = PM.cero();
      if (activas.has('base')) {
        var n = V.length - 1, bv = V.map(function (x) { return share ? 100 : x.base; });
        series.push(PM.linea(BASE, { ancho: 2.5, punteada: share, extra: {
          name: 'Base monetaria', data: bv, z: 5,
          markPoint: share ? undefined : PM.puntoFinal(BASE, n, bv[n])
        } }));
      }
      var el = document.getElementById('chart');
      return {
        grid: PM.grid(),
        xAxis: PM.ejeTiempo(KV, el, { boundaryGap: true }),
        yAxis: PM.ejeY({ unidad: share ? '% base' : 'MM Bs', fmt: share ? 'pct' : null }),
        tooltip: PM.tooltip(function (ps) {
          if (!ps.length) return '';
          var i = ps[0].dataIndex, x = V[i];
          panel(si + i);
          var h = PM.ttTitulo(PM.fecha(KV[i]), share ? 'Aporte a la base, en % de la base' : 'Aporte a la base, millones de Bs');
          IDENTIDAD.forEach(function (k) {
            if (!activas.has(k)) return;
            var c = comp(k), v = aporte(x, c, share), val = share ? PM.pct(v, 1, true) : conSigno(v);
            // en oscuro el gris más tenue (#242C30) no se lee sobre el tooltip: la cifra va en pizarra
            if (k === 'otras' && PM.dk()) val = '<span style="color:#8A9699">' + val + '</span>';
            h += PM.ttFila(c.color, c.nombre, val, 'area');
          });
          h += PM.ttTotal('Base monetaria', share ? '100%' : PM.auto(x.base));
          if (!share) h += PM.ttPie('Respaldo en reservas: <strong style="color:#fff">' + PM.pct(x.rin / x.base * 100, 1) + '</strong>');
          return h;
        }, { axisPointer: PM.sombraEje() }),
        series: series
      };
    }

    function lectura(x) {
      var sh = x.rin / x.base * 100, shS = x.cred_sp / x.base * 100;
      if (sh >= 150) return 'Las reservas valen <strong>' + PM.num(sh / 100, 1) + ' veces</strong> la base monetaria: régimen de <strong>sobre-respaldo externo</strong>. El BCB esteriliza el excedente con crédito interno negativo y OMA. El dinero está plenamente respaldado en divisas.';
      if (sh >= 100) return 'Las reservas aún <strong>cubren toda la base</strong> (' + PM.pct(sh, 0) + '). El respaldo externo es sólido, pero el colchón se reduce respecto de los años de bonanza.';
      if (sh >= 50) return 'El respaldo en reservas cayó a <strong>' + PM.pct(sh, 0) + '</strong>: la base ya no está plenamente cubierta por divisas. El <strong>crédito al sector público</strong> gana peso como fuente de creación de dinero.';
      if (sh >= 25) return 'Solo <strong>' + PM.pct(sh, 0) + '</strong> de la base se respalda en reservas. El crédito al sector público (' + PM.pct(shS, 0) + ' de la base) es la <strong>fuente dominante</strong> de emisión: señal de dominancia fiscal.';
      return 'Respaldo en reservas mínimo (<strong>' + PM.pct(sh, 1) + '</strong>). Prácticamente toda la base se sostiene sobre <strong>crédito al sector público</strong> (' + PM.pct(shS, 0) + '), apenas amortiguado por OMA y otras cuentas en negativo. La base está desconectada del respaldo externo.';
    }

    function panel(i) {
      if (i == null || !S || !S[i]) return;
      estado.idx = i;
      var d = S[i], a12 = i >= 12 ? S[i - 12] : S[0], fecha = PM.fecha(d.date);
      var var12 = (d.base / a12.base - 1) * 100, shRin = d.rin / d.base * 100, shSp = d.cred_sp / d.base * 100, shOma = d.oma / d.base * 100;
      document.getElementById('panel-fecha').textContent = fecha;
      document.getElementById('panel').innerHTML =
        PM.pb(BASE, 'Base monetaria', bs(d.base), 'En <strong>' + fecha + '</strong>. Variación 12 meses: <strong>' + PM.pct(var12, 1, true) + '</strong>. Es la suma de los determinantes de abajo.') +
        PM.pb(C.turquesa, 'Reservas int. netas', bs(d.rin), 'Respaldo externo: <strong>' + PM.pct(shRin, 1) + '</strong> de la base monetaria.') +
        PM.pb(C.rojo, 'Crédito neto al sector público', bs(d.cred_sp), 'Financiamiento al SPNF: <strong>' + PM.pct(shSp, 0, true) + '</strong> de la base.') +
        PM.pb(comp('oma').color, 'OMA (se resta)', bs(-d.oma), 'Liquidez retirada vía títulos del BCB: <strong>' + PM.pct(-shOma, 0) + '</strong> de la base.') +
        PM.ctx(lectura(d));
    }

    // Las cifras de las respuestas salen del dato (ningún número publicado se escribe a mano)
    function preguntas() {
      var u = S[S.length - 1], piso = null;
      S.forEach(function (x) { if (x.date >= '2014-01' && (!piso || x.otras < piso.otras)) piso = x; });
      var shSp = u.cred_sp / u.base * 100;
      return [
      ['¿Qué son los determinantes de la base?', 'La <strong>base monetaria</strong> es el dinero primario que crea el Banco Central. Según el cuadro oficial del BCB, sus fuentes son: <strong>Reservas Internacionales Netas</strong> (respaldo externo), <strong>Crédito Neto al Sector Público</strong>, <strong>Crédito a Bancos</strong>, las <strong>OMA</strong> (que se restan) y <strong>Otras Cuentas (Neto)</strong>. La suma reproduce, peso por peso, la base monetaria.'],
      ['¿Qué son las OMA y por qué se restan?', 'Las <strong>Operaciones de Mercado Abierto (OMA)</strong> son la venta de títulos del BCB (letras y bonos) para <strong>retirar liquidez</strong> de la economía. Como absorben dinero, <strong>se restan</strong> de la base: son el principal instrumento contractivo del Banco Central. Cuando el BCB <em>redime</em> esos títulos (deja vencer su deuda), inyecta liquidez y la base crece.'],
      ['¿Por qué el RIN puede superar el 100%?', 'En el auge del gas (2006–2014) las reservas llegaron a valer <strong>más que toda la base monetaria</strong>. El exceso se compensaba con crédito interno negativo y OMA: el BCB <em>esterilizaba</em> el ingreso de dólares. Era un régimen de sobre-respaldo externo, hoy revertido.'],
      ['Crédito al sector público y dominancia fiscal', 'Cuando el déficit fiscal se financia con el Banco Central, el <strong>crédito neto al sector público</strong> se vuelve la fuente dominante de creación de dinero: es la <strong>dominancia fiscal</strong>. En Bolivia este componente pasó de ser pequeño hasta 2017 a equivaler al <strong>' + PM.pct(shSp, 0) + '</strong> de la base en ' + PM.fecha(u.date) + ' (lo que suman las reservas y el crédito a bancos lo compensan la OMA y las otras cuentas, en negativo).'],
      ['¿Qué son las «Otras cuentas (neto)»?', 'Es el <strong>residuo contable</strong> del balance: todo lo que no es reservas, crédito al sector público, crédito a bancos ni OMA. Sus piezas principales son el <strong>patrimonio del propio BCB</strong> (capital, reservas y cuentas de revaluación) y sus <strong>obligaciones externas de largo plazo</strong>. Son pasivos no monetarios: por eso suele ser <strong>negativo</strong> y actúa como un contrapeso que absorbe base monetaria. En Bolivia se hizo cada vez más negativo (de ~0 en 2014 a ' + PM.auto(piso.otras) + ' MM en ' + PM.fecha(piso.date) + '), por el crecimiento del patrimonio del BCB y de su deuda externa.'],
      ['Base monetaria vs. emisión', 'No son lo mismo. La <strong>emisión</strong> = billetes y monedas + caja de los bancos. La <strong>base monetaria</strong> es más amplia: billetes y monedas + <strong>reservas bancarias</strong> (incluye el encaje depositado en el BCB). Este cuadro descompone la base monetaria, el agregado sobre el que el BCB ejerce control más directo.']
      ];
    }
  })();
  </script>
</body>
</html>
