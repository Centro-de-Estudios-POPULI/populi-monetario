<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#0A9396">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservas Internacionales · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Reservas Internacionales</div>
      <div class="sec-sub">Reservas Internacionales Netas y su composición, en millones de USD</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Rango</span><div class="hz-grp" id="b-rango"></div></div>
      <div class="hz-item"><span class="hz-lbl">Medida</span><div class="hz-grp" id="b-medida"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando reservas internacionales…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Composición de reservas</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C;
    // Componentes que se apilan y suman exactamente la RIN (identidad del BCB: RIB = RIN = oro + divisas + DEG + FMI).
    // En tema oscuro el petróleo y el granate quedan bajo 3:1 contra la tarjeta: suben a menta y rojo (validado).
    var COMP = [
      { k: 'oro', nombre: 'Oro', color: C.oro },
      { k: 'divisas', nombre: 'Divisas', color: { claro: C.petroleo, oscuro: C.menta } },
      { k: 'deg', nombre: 'DEG', color: { claro: C.granate, oscuro: C.rojo } },
      { k: 'fmi', nombre: 'Pos. FMI', color: { claro: C.gris, oscuro: '#6E7A7D' } }
    ];
    var RIN = C.turquesa;
    var estado = { rango: 'desde2010', medida: 'abs', idx: null };
    var activas = new Set(COMP.map(function (c) { return c.k; }));
    var S, G, M, K, si = 0, grafico;
    var mm = function (v) { return PM.mm(v); };

    PM.cargar(['reservas_rin.json']).then(function (r) {
      S = r[0].series; M = r[0].metadata;
      // El gráfico usa la serie mensual y, para el mes en curso, el último dato semanal: así cada
      // tramo del eje es un mes (las cuatro semanas de un mes no ocupan cuatro tramos).
      var semanal = function (x) { return /-S\d$/.test(x.date); };
      var mens = S.filter(function (x) { return !semanal(x); }), ult = S[S.length - 1];
      G = (semanal(ult) && ult.date.slice(0, 7) > mens[mens.length - 1].date) ? mens.concat([ult]) : mens;
      K = G.map(function (x) { return x.date; });
      estado.idx = G.length - 1;
      PM.botonera(document.getElementById('b-rango'), [['5a', '5 años'], ['desde2010', 'Desde 2010'], ['desde2000', 'Desde 2000'], ['todo', 'Todo']],
        estado.rango, function (v) { estado.rango = v; grafico.redibujar(); });
      PM.botonera(document.getElementById('b-medida'), [['abs', 'MM USD'], ['pct', '% de las RIN']],
        estado.medida, function (v) { estado.medida = v; grafico.redibujar(); });
      PM.pastillas(document.getElementById('pastillas'),
        COMP.map(function (c) { return { k: c.k, nombre: c.nombre, color: c.color, forma: 'area' }; }),
        activas, function () { grafico.redibujar(); });
      cifras();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      grafico.chart.on('click', function (p) { if (p.dataIndex != null) panel(si + p.dataIndex); });
      panel(estado.idx);
      PM.alCambiarTema(function () { cifras(); panel(estado.idx); });
      PM.preguntas(document.getElementById('preguntas'), PREGUNTAS);
      document.getElementById('fuente').innerHTML = 'Fuente: <a href="https://www.bcb.gob.bo/?q=estad-sticas-semanales" target="_blank" rel="noopener">BCB — Estadísticas Semanales</a> · Elaboración: Centro de Estudios POPULI · Datos al: ' + PM.fecha(M.ultimo_dato);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    function cifras() {
      var u = S[S.length - 1], rin = u.rin || 0, oro = u.oro || 0, div = u.divisas || 0, v12 = M.var_12m_rin_pct;
      // minilíneas: los últimos 24 meses de cada cifra (serie mensual + el mes en curso)
      var serie = function (f) { return PM.ultimos(G.map(f), 24); };
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: RIN, rotulo: 'RIN (netas)', valor: mm(rin), delta: PM.flecha(v12) + ' ' + PM.pct(Math.abs(v12), 1) + ' en 12 meses', tono: v12 >= 0 ? 'bueno' : 'malo', serie: serie(function (x) { return x.rin; }) }) +
        PM.kpi({ color: C.oro, rotulo: 'Oro', valor: mm(oro), delta: PM.pct(rin ? oro / rin * 100 : null, 1) + ' de las RIN', tono: 'neutro', serie: serie(function (x) { return x.oro; }) }) +
        PM.kpi({ color: COMP[1].color, rotulo: 'Divisas', valor: mm(div), delta: div < 500 ? 'Nivel crítico' : 'Operativo', tono: div < 500 ? 'malo' : 'neutro', serie: serie(function (x) { return x.divisas; }) }) +
        PM.kpi({ color: COMP[2].color, rotulo: 'DEG + FMI', valor: mm((u.deg || 0) + (u.fmi || 0)), delta: 'Posiciones multilaterales', tono: 'neutro', serie: serie(function (x) { return (x.deg || 0) + (x.fmi || 0); }) });
    }

    function opciones() {
      si = PM.desde(K, estado.rango);
      var V = G.slice(si), KV = K.slice(si), pct = estado.medida === 'pct', dk = PM.dk();
      // Total por punto = suma de los cuatro componentes presentes
      var tot = V.map(function (x) {
        var t = 0, hay = false;
        COMP.forEach(function (c) { if (x[c.k] != null) { t += x[c.k]; hay = true; } });
        return hay ? t : null;
      });
      var series = COMP.filter(function (c) { return activas.has(c.k); }).map(function (c) {
        var col = PM.col(c.color);
        return PM.linea(c.color, { ancho: 1, extra: {
          name: c.nombre, stack: 'rin',
          // smoothMonotone:'x' es obligatorio en un APILADO: sin él la spline sobrepasa en los
          // quiebres e inventa bandas que se hunden por debajo del dato real.
          smooth: 0.35, smoothMonotone: 'x',
          data: V.map(function (x, i) {
            var v = x[c.k];
            if (v == null) return pct ? null : 0;           // en el apilado absoluto, null cuenta como 0
            return pct ? (tot[i] ? +(v / tot[i] * 100).toFixed(2) : null) : v;
          }),
          areaStyle: { color: col, opacity: dk ? 0.82 : 0.88 }
        } });
      });
      var el = document.getElementById('chart');
      return {
        animationDuration: 450,
        grid: PM.grid(pct ? { top: 16 } : null),
        xAxis: PM.ejeTiempo(KV, el),
        yAxis: PM.ejeY({ unidad: pct ? '' : 'MM USD', fmt: pct ? 'pct' : null, extra: { max: pct ? 100 : null } }),
        tooltip: PM.tooltip(function (ps) {
          if (!ps.length) return '';
          var i = ps[0].dataIndex;
          panel(si + i);
          var h = PM.ttTitulo(PM.fecha(KV[i]));
          ps.slice().reverse().forEach(function (p) {
            if (p.value == null) return;
            var c = COMP.filter(function (x) { return x.nombre === p.seriesName; })[0];
            h += PM.ttFila(c.color, p.seriesName, pct ? PM.pct(p.value, 1) : mm(p.value), 'area');
          });
          if (tot[i] != null) h += PM.ttTotal('RIN total', mm(tot[i]));
          return h;
        }),
        series: series
      };
    }

    function panel(i) {
      if (i == null || !G || !G[i]) return;
      estado.idx = i;
      var d = G[i], rin = d.rin || 0, oro = d.oro || 0, div = d.divisas || 0, deg = d.deg || 0, fmi = d.fmi || 0;
      var parte = function (v) { return rin > 0 ? PM.pct(v / rin * 100, 1) + ' de las RIN' : ''; };
      var pOro = PM.pct(rin ? oro / rin * 100 : 0, 1), pDiv = PM.pct(rin ? div / rin * 100 : 0, 1);
      var txt;
      if (div < 200) txt = 'Divisas líquidas en <strong>' + mm(div) + '</strong>: nivel <strong>crítico</strong>. El BCB tiene muy limitada capacidad de intervención cambiaria. El oro (' + pOro + ' de las RIN) no es fácilmente convertible a corto plazo.';
      else if (div < 500) txt = 'Divisas en <strong>' + mm(div) + '</strong>: nivel <strong>bajo</strong>. La mayor parte de las RIN es oro (<strong>' + pOro + '</strong>), que requiere operaciones de mercado para convertirse en liquidez.';
      else if (rin < 5000) txt = 'RIN en <strong>' + mm(rin) + '</strong>. Nivel <strong>moderado</strong>, con diversificación entre oro (' + pOro + ') y divisas (' + pDiv + ').';
      else txt = 'RIN en <strong>' + mm(rin) + '</strong>: nivel <strong>holgado</strong>. Buen respaldo para la estabilidad cambiaria.';
      document.getElementById('panel-fecha').textContent = PM.fecha(d.date);
      document.getElementById('panel').innerHTML =
        PM.pb(RIN, 'RIN (netas)', mm(rin)) +
        PM.pb(C.oro, 'Oro', mm(oro), parte(oro)) +
        PM.pb(COMP[1].color, 'Divisas líquidas', mm(div), parte(div)) +
        PM.pb(COMP[2].color, 'DEG', mm(deg), parte(deg)) +
        PM.pb(COMP[3].color, 'Posición FMI', mm(fmi), parte(fmi)) +
        PM.ctx(txt);
    }

    var PREGUNTAS = [
      ['¿Qué son las RIN?', 'Las <strong>Reservas Internacionales Netas</strong> son los activos externos del banco central menos sus pasivos de corto plazo con el exterior. Son el respaldo en divisas de la moneda nacional y la primera línea de defensa ante crisis de balanza de pagos.'],
      ['Composición: oro vs. divisas', 'El <strong>oro</strong> es un activo de reserva que se revaloriza con el mercado internacional, pero tiene menor liquidez que las <strong>divisas</strong> (dólares, euros). Bolivia ha incrementado sus reservas de oro, pero las divisas líquidas son las que se usan para intervenir en el mercado cambiario.'],
      ['¿Cuánto es suficiente?', 'El FMI recomienda que las reservas cubran al menos <strong>3 meses de importaciones</strong> o el 20% de M2. Bolivia importa ~$10.000 MM al año, por lo que necesita ~$2.500 MM como mínimo. Otro criterio es la regla de Guidotti: cubrir la deuda externa de corto plazo al 100%.'],
      ['Teoría cualitativa del dinero', 'La <strong>teoría cualitativa</strong> sostiene que la estabilidad monetaria depende no solo de la cantidad de dinero, sino de su <strong>calidad</strong>. La primera dimensión de la calidad es el <strong>respaldo</strong>: en economías con monedas no centrales, la cantidad de reservas internacionales es crucial para dar respaldo a la moneda nacional. Sin respaldo suficiente, la confianza en el dinero se deteriora.'],
      ['Indicador ARA del FMI', 'El FMI subraya la importancia de reservas adecuadas para mitigar crisis de balanza de pagos. Tres métricas clave: <strong>reservas/M2</strong> (estándar mínimo: 0,5), <strong>reservas/meses de importación</strong> (nivel prudente: 3 meses) y <strong>reservas/deuda externa de corto plazo</strong> (criterio aceptable: al menos 1). Bolivia enfrenta desafíos en las tres métricas.']
    ];
  })();
  </script>
</body>
</html>
