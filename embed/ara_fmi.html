<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#0A9396">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suficiencia de Reservas (ARA-FMI) · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
  <style>
    /* Las cifras eligen el indicador del gráfico (propio de este gráfico, no del molde) */
    .kpi[data-ind] { cursor: pointer; transition: border-color .2s, box-shadow .2s; }
    .kpi[data-ind]:hover { border-color: var(--tenue); }
    .kpi.sel, .kpi.sel:hover { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento); }
    .kpi-thr { font-size: .6rem; color: var(--muted); margin-top: 5px; line-height: 1.35; }
    .umbral { font-family: 'Inter', sans-serif; font-size: .65rem; font-weight: 500; color: var(--muted); }
    .pb .ctx { margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Suficiencia de Reservas (ARA-FMI)</div>
      <div class="sec-sub" id="sub"></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando indicadores ARA-FMI…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Bolivia — Diagnóstico ARA</span><span class="panel-hd-d">Último dato disponible</span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    PM.leyendaResto = 'Otros países';   // en la imagen descargada, el contexto gris va en una sola entrada
    var C = PM.C;
    var IND = ['Reserves_ARA', 'Reserves_M2', 'Reserves_STD', 'Reserves_M'];
    var CORTO_IND = { Reserves_ARA: 'ARA general', Reserves_M2: 'Reservas/M2', Reserves_STD: 'Reservas/Deuda CP', Reserves_M: 'Meses de importación' };
    var COL_IND = { Reserves_ARA: C.rojoClaro, Reserves_M2: { claro: C.petroleo, oscuro: C.menta }, Reserves_STD: C.oro, Reserves_M: C.turquesa };
    var NOMBRE = { Bolivia: 'Bolivia', Chile: 'Chile', Peru: 'Perú', Colombia: 'Colombia', Brazil: 'Brasil', Paraguay: 'Paraguay', Argentina: 'Argentina', Uruguay: 'Uruguay', Ecuador: 'Ecuador' };
    var CORTO = { Bolivia: 'BOL', Chile: 'CHL', Peru: 'PER', Colombia: 'COL', Brazil: 'BRA', Paraguay: 'PRY', Argentina: 'ARG', Uruguay: 'URY', Ecuador: 'ECU' };
    // Modo Foco de la marca: Bolivia en rojo (trazo grueso, último valor rotulado), el resto en gris
    // tenue, el umbral en pizarra. Al pasar el cursor sobre la línea de un país, las demás se atenúan.
    var FOCO = C.rojo;
    var CONTEXTO = { claro: '#C9CDCE', oscuro: '#3A4549' };       // líneas de contexto
    var CTX_TIP = { claro: '#C9CDCE', oscuro: '#8A9699' };        // su clave sobre el tooltip oscuro
    var CTX_PILL = { claro: '#8A9699', oscuro: '#6E7A7D' };       // su pastilla (el tenue no se distingue encendido de apagado)
    var DIAG = { Reserves_ARA: 'compuesto (ARA)', Reserves_M2: 'de reservas sobre M2', Reserves_STD: 'de deuda de corto plazo', Reserves_M: 'de meses de importación' };
    var estado = { ind: 'Reserves_ARA' };
    var activos = new Set(['Bolivia', 'Chile', 'Peru', 'Colombia', 'Argentina']);
    var DATA, grafico;

    function umbral(k) { return PM.tick(DATA.indicators[k].threshold) + (k === 'Reserves_M' ? ' meses' : 'x'); }
    // serie anual de Bolivia de un indicador, año por año (un año sin dato corta la minilínea)
    function serieBolivia(k) {
      var s = DATA.series[k].Bolivia || [], porAnio = {}, a0 = Infinity, a1 = -Infinity, out = [];
      s.forEach(function (p) { porAnio[p.year] = p.value; a0 = Math.min(a0, p.year); a1 = Math.max(a1, p.year); });
      for (var y = a0; y <= a1; y++) out.push(porAnio[y] !== undefined ? porAnio[y] : null);
      return out;
    }
    function ultimo(k) { return DATA.metadata.bolivia_ultimo[k] || null; }

    PM.cargar(['ara_fmi.json']).then(function (r) {
      DATA = r[0];
      var m = DATA.metadata;
      document.getElementById('sub').textContent = 'Assessing Reserve Adequacy — Comparativa regional · ' + m.primer_dato + '–' + m.ultimo_dato;
      cifras();
      pastillas();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      panel();
      PM.alCambiarTema(function () { cifras(); pintarPastillas(); panel(); });
      PM.preguntas(document.getElementById('preguntas'), PREGUNTAS);
      document.getElementById('fuente').innerHTML = 'Fuente: <a href="https://www.imf.org/external/datamapper/datasets/ARA" target="_blank" rel="noopener">FMI — Assessing Reserve Adequacy (ARA)</a> · Elaboración: Centro de Estudios POPULI';
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    function cifras() {
      var el = document.getElementById('kpis');
      el.innerHTML = IND.map(function (k) {
        var bv = ultimo(k), val = bv ? bv.value : null, ok = val != null && val >= DATA.indicators[k].threshold, sel = k === estado.ind;
        return '<div class="kpi' + (sel ? ' sel' : '') + '" data-ind="' + k + '" role="button" tabindex="0" aria-pressed="' + sel + '" style="--kc:' + PM.col(COL_IND[k]) + '">' +
          '<div class="kpi-lbl">' + CORTO_IND[k] + '</div>' +
          '<div class="kpi-val" style="color:' + PM.tx(COL_IND[k]) + '">' + PM.num(val, 2) + '</div>' +
          '<div class="kpi-d ' + (ok ? 'bueno' : 'malo') + '">' + (ok ? '✓ Adecuado' : '▼ Insuficiente') + '</div>' +
          '<div class="kpi-thr">Umbral ' + (k === 'Reserves_M2' ? '0,2 (20%)' : umbral(k)) + ' · dato ' + (bv ? bv.year : '—') + '</div>' +
          PM.mini(serieBolivia(k), COL_IND[k]) + '</div>';
      }).join('');
      el.querySelectorAll('.kpi').forEach(function (e) {
        var elegir = function () {
          if (estado.ind === e.dataset.ind) return;
          estado.ind = e.dataset.ind;
          el.querySelectorAll('.kpi').forEach(function (x) { var s = x === e; x.classList.toggle('sel', s); x.setAttribute('aria-pressed', s); });
          grafico.redibujar();
        };
        e.addEventListener('click', elegir);
        e.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); elegir(); } });
      });
    }

    // Pastillas de países: Bolivia es el caso y no se apaga
    function pastillas() {
      var el = document.getElementById('pastillas');
      el.innerHTML = '';
      DATA.metadata.paises.forEach(function (c) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pill'; b.dataset.k = c; b.title = NOMBRE[c] || c;
        b.innerHTML = '<span class="lp"></span>' + (CORTO[c] || c);
        if (c === 'Bolivia') b.setAttribute('aria-disabled', 'true');
        b.addEventListener('click', function () {
          if (c === 'Bolivia') return;
          if (activos.has(c)) activos.delete(c); else activos.add(c);
          pintarPastillas();
          grafico.redibujar();
        });
        el.appendChild(b);
      });
      pintarPastillas();
    }
    function pintarPastillas() {
      var dk = PM.dk();
      document.querySelectorAll('#pastillas .pill').forEach(function (b) {
        var col = b.dataset.k === 'Bolivia' ? FOCO : CTX_PILL;
        b.style.setProperty('--pc', PM.col(col));
        b.style.setProperty('--pf', PM.rgba(col, dk ? 0.16 : 0.09));
        b.style.setProperty('--pb', PM.rgba(col, dk ? 0.6 : 0.45));
        b.setAttribute('aria-pressed', activos.has(b.dataset.k));
      });
    }

    function opciones() {
      var k = estado.ind, sd = DATA.series[k], meta = DATA.indicators[k], dk = PM.dk();
      var anios = [];
      Object.keys(sd).forEach(function (c) { sd[c].forEach(function (p) { if (anios.indexOf(p.year) < 0) anios.push(p.year); }); });
      anios.sort(function (a, b) { return a - b; });
      var K = anios.map(String);
      // el contexto primero; Bolivia al final, encima de todo
      var orden = DATA.metadata.paises.filter(function (c) { return activos.has(c) && c !== 'Bolivia'; }).concat(['Bolivia']);
      var series = orden.map(function (c) {
        var porAnio = {};
        (sd[c] || []).forEach(function (p) { porAnio[p.year] = p.value; });
        var data = anios.map(function (y) { return porAnio[y] !== undefined ? porAnio[y] : null; });
        var bol = c === 'Bolivia';
        var o = PM.linea(bol ? FOCO : CONTEXTO, { ancho: bol ? 2.5 : 1.75, punto: bol ? 8 : 6, extra: {
          name: NOMBRE[c] || c, data: data, connectNulls: true, z: bol ? 10 : 2,
          // el cursor por eje «resalta» todas las series: el énfasis no cambia color ni grosor (rompería el Foco)
          emphasis: { focus: 'series', lineStyle: { width: bol ? 2.5 : 1.75 } }
        } });
        if (!bol) {
          // el contexto también cierra en su último dato, con un punto chico de su mismo gris
          var uc = data.length - 1;
          while (uc > 0 && data[uc] == null) uc--;
          var pc = PM.puntoFinal(CONTEXTO, uc, data[uc]);
          pc.symbolSize = 6; pc.z = 2;
          o.markPoint = pc;
        }
        if (bol) {
          var n = data.length - 1;
          while (n > 0 && data[n] == null) n--;
          var mp = PM.puntoFinal(FOCO, n, data[n]);
          mp.label = { show: true, position: 'top', distance: 8, align: 'right', offset: [4, 0], formatter: PM.num(data[n], 2), color: PM.tx(FOCO),
            fontFamily: PM.mono(), fontWeight: 700, fontSize: 11, textBorderColor: PM.var('--card') || '#fff', textBorderWidth: 3 };
          o.markPoint = mp;
          o.markLine = { silent: true, symbol: 'none', animation: false, data: [{ yAxis: meta.threshold }],
            lineStyle: { color: PM.var('--pizarra'), width: 1.25, type: 'dashed' },
            label: { show: true, position: 'insideStartTop', formatter: 'Umbral ' + umbral(k), color: PM.var('--pizarra'),
              fontFamily: PM.mono(), fontSize: 10, fontWeight: 600, textBorderColor: PM.var('--card') || '#fff', textBorderWidth: 3 } };   // halo: las líneas de contexto no lo tapan
        }
        return o;
      });
      var el = document.getElementById('chart');
      // un decimal sólo si el rango lo pide (ARA, M2); en deuda CP y meses los cortes son enteros
      var maximo = 0;
      series.forEach(function (o) { o.data.forEach(function (v) { if (v != null && v > maximo) maximo = v; }); });
      var dec = maximo >= 5 ? null : 1;
      return {
        // el último año (2025) lleva rótulo en el borde: el margen derecho tiene que alojar su mitad
        grid: PM.grid({ right: 18 }),
        xAxis: PM.ejeTiempo(K, el),
        yAxis: PM.ejeY({ unidad: CORTO_IND[k], fmt: dec ? function (v) { return PM.num(v, dec); } : null, extra: { nameTextStyle: { align: 'left' } } }),
        tooltip: PM.tooltip(function (ps) {
          var v = ps.filter(function (p) { return p.value != null; });
          if (!v.length) return '';
          v.sort(function (a, b) { return b.value - a.value; });
          var h = PM.ttTitulo(ps[0].axisValue);
          v.forEach(function (p) { h += PM.ttFila(p.seriesName === 'Bolivia' ? FOCO : CTX_TIP, p.seriesName, PM.num(p.value, 2), 'linea'); });
          return h + PM.ttPie('Umbral: ' + umbral(k));
        }),
        series: series
      };
    }

    function panel() {
      var malos = 0, buenos = [], html = '';
      IND.forEach(function (k) {
        var bv = ultimo(k), val = bv ? bv.value : null, yr = bv ? bv.year : '—', thr = DATA.indicators[k].threshold;
        var ok = val != null && val >= thr, color = ok ? C.turquesa : C.rojo;
        if (val != null) { if (ok) buenos.push(k); else malos++; }
        var serie = DATA.series[k].Bolivia || [], pico = null;
        serie.forEach(function (p) { if (!pico || p.value > pico.value) pico = p; });
        var desc = '';
        if (k === 'Reserves_ARA') desc = val < thr ? 'Bolivia no alcanza el nivel de reservas adecuado según la métrica compuesta del FMI. Esto implica vulnerabilidad ante choques externos.' : 'Reservas adecuadas según el indicador compuesto del FMI.';
        else if (k === 'Reserves_M2') desc = val < thr ? 'Solo el ' + PM.pct(val * 100, 1) + ' del dinero amplio está respaldado por reservas. Muy por debajo del mínimo recomendado de 20%, lo que limita la capacidad de defender el tipo de cambio.' : 'Respaldo adecuado del dinero amplio con reservas internacionales.';
        else if (k === 'Reserves_STD') desc = val < thr ? 'Las reservas no cubren la totalidad de la deuda externa de corto plazo, lo que viola la regla de Guidotti.' : 'Las reservas cubren la deuda externa de corto plazo, en cumplimiento de la regla de Guidotti-Greenspan.';
        else desc = val < thr ? 'Con ' + PM.num(val, 1) + ' meses de cobertura, Bolivia está por debajo del nivel prudente de 3 meses. El margen para financiar importaciones con reservas es muy limitado.' : 'Cobertura de importaciones por encima del nivel prudente de 3 meses.';
        html += '<div class="pb"><div class="pb-lbl" style="color:' + PM.tx(color) + ';background:' + PM.rgba(color, PM.dk() ? 0.16 : 0.08) + ';border-left-color:' + PM.col(color) + '">' + CORTO_IND[k] + '</div>' +
          '<div class="pb-val" style="color:' + PM.tx(color) + '">' + PM.num(val, 2) + '<span class="umbral"> / ' + umbral(k) + ' (' + yr + ')</span></div>' +
          '<p class="pb-desc">' + desc + '</p>' +
          (pico ? PM.ctx('<strong>Máximo: ' + PM.num(pico.value, 2) + ' (' + pico.year + ')</strong>') : '') + '</div>';
      });
      // Diagnóstico: el conteo sale de los datos, no del texto
      var picoAra = null;
      (DATA.series.Reserves_ARA.Bolivia || []).forEach(function (p) { if (!picoAra || p.value > picoAra.value) picoAra = p; });
      var diag = 'Bolivia presenta insuficiencia de reservas en <strong>' + malos + ' de ' + IND.length + ' indicadores ARA</strong>.' +
        (picoAra ? ' La tendencia descendente desde ' + picoAra.year + ' refleja el agotamiento del modelo de financiamiento con reservas del banco central.' : '');
      if (buenos.length === 1) {
        var k1 = buenos[0], s1 = DATA.series[k1].Bolivia || [], u1 = ultimo(k1), previo = null;
        s1.forEach(function (p) { if (p.year === u1.year - 1) previo = p; });
        diag += ' Solo el indicador ' + DIAG[k1] + (previo && previo.value < DATA.indicators[k1].threshold
          ? ' se recuperó por encima del umbral en ' + u1.year + '.' : ' se mantiene por encima del umbral (' + u1.year + ').');
      }
      html += '<div class="pb"><div class="pb-lbl" style="color:' + PM.tx(C.rojo) + ';background:' + PM.rgba(C.rojo, PM.dk() ? 0.16 : 0.08) + ';border-left-color:' + C.rojo + '">Diagnóstico</div>' +
        '<p class="pb-desc" style="margin-top:4px">' + diag + '</p></div>';
      document.getElementById('panel').innerHTML = html;
    }

    var PREGUNTAS = [
      ['Metodología ARA del FMI', 'La métrica <strong>Assessing Reserve Adequacy</strong> (ARA) del FMI es un indicador compuesto que pondera cuatro fuentes de riesgo: exportaciones, dinero amplio (M2), deuda externa de corto plazo y otros pasivos. Un valor <strong>≥ 1</strong> indica reservas adecuadas para enfrentar choques externos sin necesidad de ajustes abruptos en la política cambiaria o comercial.'],
      ['Reservas / M2 (dinero amplio)', 'Mide qué proporción de los depósitos y billetes en circulación está respaldada por reservas internacionales. El estándar mínimo del FMI es <strong>20% (0,2)</strong>. Cuando este ratio cae, el banco central pierde capacidad para defender la paridad cambiaria ante corridas bancarias o fuga de capitales, porque M2 mide el dinero que podría convertirse rápidamente en demanda de dólares.'],
      ['Regla de Guidotti: reservas / deuda CP', 'La <strong>regla de Guidotti-Greenspan</strong> establece que las reservas deben cubrir al menos el 100% de la deuda externa de corto plazo (vencimientos ≤ 1 año). Un ratio <strong>≥ 1</strong> significa que el país puede pagar todos sus compromisos externos inmediatos sin recurrir a nuevos préstamos. Bolivia recuperó este umbral en 2025 tras caer por debajo en 2024.'],
      ['Meses de importación', 'Métrica clásica de cobertura: cuántos meses de importaciones puede financiar el país solo con reservas. El nivel <strong>prudente es ≥ 3 meses</strong>. Bolivia pasó de más de 15 meses de cobertura en 2012-2015 a apenas 2 meses en 2024, reflejo del agotamiento de las reservas líquidas frente a una economía que sigue importando a ritmo elevado.'],
      ['Bolivia en contexto regional', 'Bolivia y Argentina son los dos países de Sudamérica con los indicadores ARA más deteriorados. Mientras Perú, Colombia y Paraguay mantienen ratios por encima de los umbrales recomendados, Bolivia enfrenta una situación crítica en 3 de los 4 indicadores. La pérdida de reservas refleja años de déficits gemelos (fiscal y externo) financiados con activos del banco central.']
    ];
  })();
  </script>
</body>
</html>
