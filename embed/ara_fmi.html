<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#0A9396">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-en="Reserve Adequacy (ARA-IMF) · Populi">Suficiencia de Reservas (ARA-FMI) · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
  <style>
    /* Las cifras eligen el indicador del gráfico (propio de este gráfico, no del molde) */
    .kpi[data-ind] { cursor: pointer; transition: border-color .2s, box-shadow .2s; }
    .kpi[data-ind]:hover { border-color: var(--tenue); }
    .kpi.sel, .kpi.sel:hover { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento); }
    .kpi-thr { font-size: .6rem; color: var(--muted); margin-top: 5px; line-height: 1.35; }
    .umbral { font-family: 'Inter', sans-serif; font-size: .65rem; font-weight: 500; color: var(--muted); }
    .pb .ctx { margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title" data-en='<span class="accent-bar"></span>Reserve Adequacy (ARA-IMF)'><span class="accent-bar"></span>Suficiencia de Reservas (ARA-FMI)</div>
      <div class="sec-sub" id="sub"></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span data-en="Loading ARA-IMF indicators…">Cargando indicadores ARA-FMI…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t" data-en="Bolivia — ARA Diagnosis">Bolivia — Diagnóstico ARA</span><span class="panel-hd-d" data-en="Latest available data">Último dato disponible</span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    PM.leyendaResto = PM.t('Otros países', 'Other countries');   // en la imagen descargada, el contexto gris va en una sola entrada
    var C = PM.C, T = PM.t;   // T('castellano', 'inglés'): con ?lang=en el gráfico sale en inglés
    var IND = ['Reserves_ARA', 'Reserves_M2', 'Reserves_STD', 'Reserves_M'];
    var CORTO_IND = { Reserves_ARA: T('ARA general', 'Overall ARA'), Reserves_M2: T('Reservas/M2', 'Reserves/M2'), Reserves_STD: T('Reservas/Deuda CP', 'Reserves/ST debt'), Reserves_M: T('Meses de importación', 'Months of imports') };
    var COL_IND = { Reserves_ARA: C.rojoClaro, Reserves_M2: { claro: C.petroleo, oscuro: C.menta }, Reserves_STD: C.oro, Reserves_M: C.turquesa };
    // Los países vienen del FMI con su nombre en inglés (la clave): en inglés se muestra ese nombre original.
    var NOMBRE = { Bolivia: 'Bolivia', Chile: 'Chile', Peru: T('Perú', 'Peru'), Colombia: 'Colombia', Brazil: T('Brasil', 'Brazil'), Paraguay: 'Paraguay', Argentina: 'Argentina', Uruguay: 'Uruguay', Ecuador: 'Ecuador' };
    var CORTO = { Bolivia: 'BOL', Chile: 'CHL', Peru: 'PER', Colombia: 'COL', Brazil: 'BRA', Paraguay: 'PRY', Argentina: 'ARG', Uruguay: 'URY', Ecuador: 'ECU' };
    // Modo Foco de la marca: Bolivia en rojo (trazo grueso, último valor rotulado), el resto en gris
    // tenue, el umbral en pizarra. Al pasar el cursor sobre la línea de un país, las demás se atenúan.
    var FOCO = C.rojo;
    var CONTEXTO = { claro: '#C9CDCE', oscuro: '#3A4549' };       // líneas de contexto
    var CTX_TIP = { claro: '#C9CDCE', oscuro: '#8A9699' };        // su clave sobre el tooltip oscuro
    var CTX_PILL = { claro: '#8A9699', oscuro: '#6E7A7D' };       // su pastilla (el tenue no se distingue encendido de apagado)
    // En inglés el calificativo va ANTES de «indicator» («Only the short-term debt indicator…»): ver el diagnóstico del panel.
    var DIAG = { Reserves_ARA: T('compuesto (ARA)', 'composite (ARA)'), Reserves_M2: T('de reservas sobre M2', 'reserves-to-M2'), Reserves_STD: T('de deuda de corto plazo', 'short-term debt'), Reserves_M: T('de meses de importación', 'months-of-imports') };
    var estado = { ind: 'Reserves_ARA' };
    var activos = new Set(['Bolivia', 'Chile', 'Peru', 'Colombia', 'Argentina']);
    var DATA, grafico;

    function umbral(k) { return PM.tick(DATA.indicators[k].threshold) + (k === 'Reserves_M' ? T(' meses', ' months') : 'x'); }
    // serie anual de Bolivia de un indicador, año por año (un año sin dato corta la minilínea)
    function serieBolivia(k) {
      var s = DATA.series[k].Bolivia || [], porAnio = {}, a0 = Infinity, a1 = -Infinity, out = [];
      s.forEach(function (p) { porAnio[p.year] = p.value; a0 = Math.min(a0, p.year); a1 = Math.max(a1, p.year); });
      for (var y = a0; y <= a1; y++) out.push(porAnio[y] !== undefined ? porAnio[y] : null);
      return out;
    }
    function ultimo(k) { return DATA.metadata.bolivia_ultimo[k] || null; }

    PM.cargar(['ara_fmi.json']).then(function (r) {
      DATA = r[0];
      var m = DATA.metadata;
      document.getElementById('sub').textContent = T('Assessing Reserve Adequacy — Comparativa regional · ' + m.primer_dato + '–' + m.ultimo_dato,
        'Assessing Reserve Adequacy — Regional comparison · ' + m.primer_dato + '–' + m.ultimo_dato);
      cifras();
      pastillas();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      panel();
      PM.alCambiarTema(function () { cifras(); pintarPastillas(); panel(); });
      PM.preguntas(document.getElementById('preguntas'), preguntas());
      document.getElementById('fuente').innerHTML = T(
        'Fuente: <a href="https://www.imf.org/external/datamapper/datasets/ARA" target="_blank" rel="noopener">FMI — Assessing Reserve Adequacy (ARA)</a> · Elaboración: Centro de Estudios POPULI',
        'Source: <a href="https://www.imf.org/external/datamapper/datasets/ARA" target="_blank" rel="noopener">IMF — Assessing Reserve Adequacy (ARA)</a> · Analysis: Centro de Estudios POPULI');
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    function cifras() {
      var el = document.getElementById('kpis');
      el.innerHTML = IND.map(function (k) {
        var bv = ultimo(k), val = bv ? bv.value : null, ok = val != null && val >= DATA.indicators[k].threshold, sel = k === estado.ind;
        return '<div class="kpi' + (sel ? ' sel' : '') + '" data-ind="' + k + '" role="button" tabindex="0" aria-pressed="' + sel + '" style="--kc:' + PM.col(COL_IND[k]) + '">' +
          '<div class="kpi-lbl">' + CORTO_IND[k] + '</div>' +
          '<div class="kpi-val" style="color:' + PM.tx(COL_IND[k]) + '">' + PM.num(val, 2) + '</div>' +
          '<div class="kpi-d ' + (ok ? 'bueno' : 'malo') + '">' + (ok ? T('✓ Adecuado', '✓ Adequate') : T('▼ Insuficiente', '▼ Insufficient')) + '</div>' +
          '<div class="kpi-thr">' + T('Umbral ' + (k === 'Reserves_M2' ? '0,2 (20%)' : umbral(k)) + ' · dato ' + (bv ? bv.year : '—'),
            'Threshold ' + (k === 'Reserves_M2' ? '0.2 (20%)' : umbral(k)) + ' · ' + (bv ? bv.year : '—') + ' data') + '</div>' +
          PM.mini(serieBolivia(k), COL_IND[k]) + '</div>';
      }).join('');
      el.querySelectorAll('.kpi').forEach(function (e) {
        var elegir = function () {
          if (estado.ind === e.dataset.ind) return;
          estado.ind = e.dataset.ind;
          el.querySelectorAll('.kpi').forEach(function (x) { var s = x === e; x.classList.toggle('sel', s); x.setAttribute('aria-pressed', s); });
          grafico.redibujar();
        };
        e.addEventListener('click', elegir);
        e.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); elegir(); } });
      });
    }

    // Pastillas de países: Bolivia es el caso y no se apaga
    function pastillas() {
      var el = document.getElementById('pastillas');
      el.innerHTML = '';
      DATA.metadata.paises.forEach(function (c) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'pill'; b.dataset.k = c; b.title = NOMBRE[c] || c;
        b.innerHTML = '<span class="lp"></span>' + (CORTO[c] || c);
        if (c === 'Bolivia') b.setAttribute('aria-disabled', 'true');
        b.addEventListener('click', function () {
          if (c === 'Bolivia') return;
          if (activos.has(c)) activos.delete(c); else activos.add(c);
          pintarPastillas();
          grafico.redibujar();
        });
        el.appendChild(b);
      });
      pintarPastillas();
    }
    function pintarPastillas() {
      var dk = PM.dk();
      document.querySelectorAll('#pastillas .pill').forEach(function (b) {
        var col = b.dataset.k === 'Bolivia' ? FOCO : CTX_PILL;
        b.style.setProperty('--pc', PM.col(col));
        b.style.setProperty('--pf', PM.rgba(col, dk ? 0.16 : 0.09));
        b.style.setProperty('--pb', PM.rgba(col, dk ? 0.6 : 0.45));
        b.setAttribute('aria-pressed', activos.has(b.dataset.k));
      });
    }

    function opciones() {
      var k = estado.ind, sd = DATA.series[k], meta = DATA.indicators[k], dk = PM.dk();
      var anios = [];
      Object.keys(sd).forEach(function (c) { sd[c].forEach(function (p) { if (anios.indexOf(p.year) < 0) anios.push(p.year); }); });
      anios.sort(function (a, b) { return a - b; });
      var K = anios.map(String);
      // el contexto primero; Bolivia al final, encima de todo
      var orden = DATA.metadata.paises.filter(function (c) { return activos.has(c) && c !== 'Bolivia'; }).concat(['Bolivia']);
      var series = orden.map(function (c) {
        var porAnio = {};
        (sd[c] || []).forEach(function (p) { porAnio[p.year] = p.value; });
        var data = anios.map(function (y) { return porAnio[y] !== undefined ? porAnio[y] : null; });
        var bol = c === 'Bolivia';
        var o = PM.linea(bol ? FOCO : CONTEXTO, { ancho: bol ? 2.5 : 1.75, punto: bol ? 8 : 6, extra: {
          name: NOMBRE[c] || c, data: data, connectNulls: true, z: bol ? 10 : 2,
          // el cursor por eje «resalta» todas las series: el énfasis no cambia color ni grosor (rompería el Foco)
          emphasis: { focus: 'series', lineStyle: { width: bol ? 2.5 : 1.75 } }
        } });
        if (!bol) {
          // el contexto también cierra en su último dato, con un punto chico de su mismo gris
          var uc = data.length - 1;
          while (uc > 0 && data[uc] == null) uc--;
          var pc = PM.puntoFinal(CONTEXTO, uc, data[uc]);
          pc.symbolSize = 6; pc.z = 2;
          o.markPoint = pc;
        }
        if (bol) {
          var n = data.length - 1;
          while (n > 0 && data[n] == null) n--;
          var mp = PM.puntoFinal(FOCO, n, data[n]);
          mp.label = { show: true, position: 'top', distance: 8, align: 'right', offset: [4, 0], formatter: PM.num(data[n], 2), color: PM.tx(FOCO),
            fontFamily: PM.mono(), fontWeight: 700, fontSize: 11, textBorderColor: PM.var('--card') || '#fff', textBorderWidth: 3 };
          o.markPoint = mp;
          o.markLine = { silent: true, symbol: 'none', animation: false, data: [{ yAxis: meta.threshold }],
            lineStyle: { color: PM.var('--pizarra'), width: 1.25, type: 'dashed' },
            label: { show: true, position: 'insideStartTop', formatter: T('Umbral ' + umbral(k), 'Threshold ' + umbral(k)), color: PM.var('--pizarra'),
              fontFamily: PM.mono(), fontSize: 10, fontWeight: 600, textBorderColor: PM.var('--card') || '#fff', textBorderWidth: 3 } };   // halo: las líneas de contexto no lo tapan
        }
        return o;
      });
      var el = document.getElementById('chart');
      // un decimal sólo si el rango lo pide (ARA, M2); en deuda CP y meses los cortes son enteros
      var maximo = 0;
      series.forEach(function (o) { o.data.forEach(function (v) { if (v != null && v > maximo) maximo = v; }); });
      var dec = maximo >= 5 ? null : 1;
      return {
        // el último año (2025) lleva rótulo en el borde: el margen derecho tiene que alojar su mitad
        grid: PM.grid({ right: 18 }),
        xAxis: PM.ejeTiempo(K, el),
        yAxis: PM.ejeY({ unidad: CORTO_IND[k], fmt: dec ? function (v) { return PM.num(v, dec); } : null, extra: { nameTextStyle: { align: 'left' } } }),
        tooltip: PM.tooltip(function (ps) {
          var v = ps.filter(function (p) { return p.value != null; });
          if (!v.length) return '';
          v.sort(function (a, b) { return b.value - a.value; });
          var h = PM.ttTitulo(ps[0].axisValue);
          v.forEach(function (p) { h += PM.ttFila(p.seriesName === 'Bolivia' ? FOCO : CTX_TIP, p.seriesName, PM.num(p.value, 2), 'linea'); });
          return h + PM.ttPie(T('Umbral: ' + umbral(k), 'Threshold: ' + umbral(k)));
        }),
        series: series
      };
    }

    function panel() {
      var malos = 0, buenos = [], html = '';
      IND.forEach(function (k) {
        var bv = ultimo(k), val = bv ? bv.value : null, yr = bv ? bv.year : '—', thr = DATA.indicators[k].threshold;
        var ok = val != null && val >= thr, color = ok ? C.turquesa : C.rojo;
        if (val != null) { if (ok) buenos.push(k); else malos++; }
        var serie = DATA.series[k].Bolivia || [], pico = null;
        serie.forEach(function (p) { if (!pico || p.value > pico.value) pico = p; });
        var desc = '';
        if (k === 'Reserves_ARA') desc = val < thr
          ? T('Bolivia no alcanza el nivel de reservas adecuado según la métrica compuesta del FMI. Esto implica vulnerabilidad ante choques externos.',
            'Bolivia does not reach the adequate level of reserves according to the composite metric of the IMF. This implies vulnerability to external shocks.')
          : T('Reservas adecuadas según el indicador compuesto del FMI.', 'Adequate reserves according to the composite indicator of the IMF.');
        else if (k === 'Reserves_M2') desc = val < thr
          ? T('Solo el ' + PM.pct(val * 100, 1) + ' del dinero amplio está respaldado por reservas. Muy por debajo del mínimo recomendado de 20%, lo que limita la capacidad de defender el tipo de cambio.',
            'Only ' + PM.pct(val * 100, 1) + ' of broad money is backed by reserves. Well below the recommended minimum of 20%, which limits the capacity to defend the exchange rate.')
          : T('Respaldo adecuado del dinero amplio con reservas internacionales.', 'Adequate backing of broad money with international reserves.');
        else if (k === 'Reserves_STD') desc = val < thr
          ? T('Las reservas no cubren la totalidad de la deuda externa de corto plazo, lo que viola la regla de Greenspan-Guidotti.',
            'Reserves do not cover the whole of the short-term external debt, which violates the Greenspan-Guidotti rule.')
          : T('Las reservas cubren la deuda externa de corto plazo, en cumplimiento de la regla de Greenspan-Guidotti.',
            'Reserves cover the short-term external debt, in compliance with the Greenspan-Guidotti rule.');
        else desc = val < thr
          ? T('Con ' + PM.num(val, 1) + ' meses de cobertura, Bolivia está por debajo del nivel prudente de 3 meses. El margen para financiar importaciones con reservas es muy limitado.',
            'With ' + PM.num(val, 1) + ' months of coverage, Bolivia is below the prudent level of 3 months. The room to finance imports with reserves is very limited.')
          : T('Cobertura de importaciones por encima del nivel prudente de 3 meses.', 'Import coverage above the prudent level of 3 months.');
        html += '<div class="pb"><div class="pb-lbl" style="color:' + PM.tx(color) + ';background:' + PM.rgba(color, PM.dk() ? 0.16 : 0.08) + ';border-left-color:' + PM.col(color) + '">' + CORTO_IND[k] + '</div>' +
          '<div class="pb-val" style="color:' + PM.tx(color) + '">' + PM.num(val, 2) + '<span class="umbral"> / ' + umbral(k) + ' (' + yr + ')</span></div>' +
          '<p class="pb-desc">' + desc + '</p>' +
          (pico ? PM.ctx(T('<strong>Máximo: ' + PM.num(pico.value, 2) + ' (' + pico.year + ')</strong>', '<strong>Peak: ' + PM.num(pico.value, 2) + ' (' + pico.year + ')</strong>')) : '') + '</div>';
      });
      // Diagnóstico: el conteo sale de los datos, no del texto
      var picoAra = null;
      (DATA.series.Reserves_ARA.Bolivia || []).forEach(function (p) { if (!picoAra || p.value > picoAra.value) picoAra = p; });
      var diag = T('Bolivia presenta insuficiencia de reservas en <strong>' + malos + ' de ' + IND.length + ' indicadores ARA</strong>.' +
        (picoAra ? ' La tendencia descendente desde ' + picoAra.year + ' refleja el agotamiento del modelo de financiamiento con reservas del banco central.' : ''),
        'Bolivia shows insufficient reserves in <strong>' + malos + ' of ' + IND.length + ' ARA indicators</strong>.' +
        (picoAra ? ' The downward trend since ' + picoAra.year + ' reflects the exhaustion of the model of financing with central bank reserves.' : ''));
      if (buenos.length === 1) {
        var k1 = buenos[0], s1 = DATA.series[k1].Bolivia || [], u1 = ultimo(k1), previo = null;
        s1.forEach(function (p) { if (p.year === u1.year - 1) previo = p; });
        diag += T(' Solo el indicador ' + DIAG[k1] + (previo && previo.value < DATA.indicators[k1].threshold
          ? ' se recuperó por encima del umbral en ' + u1.year + '.' : ' se mantiene por encima del umbral (' + u1.year + ').'),
          ' Only the ' + DIAG[k1] + ' indicator' + (previo && previo.value < DATA.indicators[k1].threshold
          ? ' recovered above the threshold in ' + u1.year + '.' : ' remains above the threshold (' + u1.year + ').'));
      }
      html += '<div class="pb"><div class="pb-lbl" style="color:' + PM.tx(C.rojo) + ';background:' + PM.rgba(C.rojo, PM.dk() ? 0.16 : 0.08) + ';border-left-color:' + C.rojo + '">' + T('Diagnóstico', 'Diagnosis') + '</div>' +
        '<p class="pb-desc" style="margin-top:4px">' + diag + '</p></div>';
      document.getElementById('panel').innerHTML = html;
    }

    // Las preguntas se arman con el dato ya cargado: lo que dicen de Bolivia y de la región (qué umbrales se
    // incumplen, desde cuándo y con qué cifra) sale del JSON, como en el panel. Escrito a mano quedaba viejo.
    function preguntas() {
      var deBolivia = function (k, anio) { var v = null; (DATA.series[k].Bolivia || []).forEach(function (p) { if (p.year === anio) v = p.value; }); return v; };
      // cuántos de los cuatro umbrales incumple un país con el último dato de cada indicador (Bolivia: el del panel)
      var incumple = function (c) {
        var n = 0;
        IND.forEach(function (k) {
          var u = c === 'Bolivia' ? ultimo(k) : null;
          if (!u) (DATA.series[k][c] || []).forEach(function (p) { if (!u || p.year > u.year) u = p; });
          if (u && u.value != null && u.value < DATA.indicators[k].threshold) n++;
        });
        return n;
      };
      // Regla de Greenspan-Guidotti: Bolivia frente al umbral con su último dato y los dos años anteriores
      var g = ultimo('Reserves_STD'), tG = DATA.indicators.Reserves_STD.threshold, fG = '';
      if (g) {
        var g1 = deBolivia('Reserves_STD', g.year - 1), g2 = deBolivia('Reserves_STD', g.year - 2);
        if (g.value < tG) fG = T(' Bolivia está por debajo de este umbral (' + g.year + ').', ' Bolivia is below this threshold (' + g.year + ').');
        else if (g1 == null || g1 >= tG) fG = T(' Bolivia cumple este umbral (' + g.year + ').', ' Bolivia meets this threshold (' + g.year + ').');
        else if (g2 != null && g2 >= tG) fG = T(' Bolivia recuperó este umbral en ' + g.year + ' tras caer por debajo en ' + (g.year - 1) + '.',
          ' Bolivia regained this threshold in ' + g.year + ' after falling below it in ' + (g.year - 1) + '.');
        else fG = T(' Bolivia recuperó este umbral en ' + g.year + '.', ' Bolivia regained this threshold in ' + g.year + '.');
      }
      // Meses de importación: el máximo de 2012-2015 (los años de más reservas) contra el último dato
      var mi = ultimo('Reserves_M'), tM = DATA.indicators.Reserves_M.threshold, tope = null, fM = '';
      (DATA.series.Reserves_M.Bolivia || []).forEach(function (p) { if (p.year >= 2012 && p.year <= 2015 && (tope == null || p.value > tope)) tope = p.value; });
      if (mi && tope != null) fM = T(' Bolivia pasó de hasta ' + PM.num(tope, 1) + ' meses de cobertura en 2012-2015 a ' + (mi.value < tM ? 'apenas ' : '') + PM.num(mi.value, 1) + ' meses en ' + mi.year + ', reflejo del agotamiento de las reservas líquidas frente a una economía que sigue importando a ritmo elevado.',
        ' Bolivia went from as much as ' + PM.num(tope, 1) + ' months of coverage in 2012-2015 to ' + (mi.value < tM ? 'barely ' : '') + PM.num(mi.value, 1) + ' months in ' + mi.year + ', a reflection of the depletion of liquid reserves in the face of an economy that keeps importing at a high pace.');
      // Región: los países que incumplen 3 o más de los 4 umbrales con su último dato
      var peores = DATA.metadata.paises.filter(function (c) { return incumple(c) >= 3; }).map(function (c) { return NOMBRE[c] || c; });
      var lista = function (y) { return peores.slice(0, -1).join(', ') + y + peores[peores.length - 1]; };
      var anioR = DATA.metadata.ultimo_dato, fR = '';
      if (peores.length === 1) fR = T(peores[0] + ' es el país de Sudamérica con los indicadores ARA más deteriorados (' + anioR + '). ',
        peores[0] + ' is the country in South America with the most deteriorated ARA indicators (' + anioR + '). ');
      else if (peores.length > 1) fR = T(lista(' y ') + ' son los países de Sudamérica con los indicadores ARA más deteriorados (' + anioR + '). ',
        lista(' and ') + ' are the countries in South America with the most deteriorated ARA indicators (' + anioR + '). ');
      var malosB = incumple('Bolivia');
      return [
      [T('Metodología ARA del FMI', 'The ARA methodology of the IMF'), T(

        'The <strong>Assessing Reserve Adequacy</strong> (ARA) metric of the IMF is a composite indicator that weights four sources of risk: exports, broad money (M2), short-term external debt and other liabilities. A value <strong>≥ 1</strong> indicates reserves adequate to face external shocks without the need for abrupt adjustments in exchange-rate or trade policy.')],
