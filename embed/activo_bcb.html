<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#005F73">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activo del Banco Central · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <div class="sec-title"><span class="accent-bar"></span>Activo del Banco Central</div>
      <div class="sec-sub">Composición del activo: reservas internacionales, otros activos externos, crédito al sector público y al sistema financiero, en millones de Bs</div>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Rango</span><div class="hz-grp" id="b-rango"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando el activo del BCB…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Composición del activo</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source"><span class="source-txt" id="fuente"></span></div>
  </div>

  <script>
  (function () {
    var C = PM.C;
    // Orden de apilado (regla 7 de la marca): el crédito al sector público —la tesis, en rojo— apoyado
    // en la base; encima las reservas y el crédito al sistema financiero, y arriba lo residual en grises.
    // En tema oscuro el petróleo sube a menta y los grises toman su paso oscuro; validado en los dos temas.
    var COMP = [
      { k: 'credito_sp', nombre: 'Créd. sector público', color: C.rojo },
      { k: 'rib', nombre: 'Reservas (RIB)', color: C.turquesa },
      { k: 'credito_sf', nombre: 'Créd. sist. financiero', color: { claro: C.petroleo, oscuro: C.menta } },
      // Otros activos externos = aportes a organismos internacionales + otros activos externos de
      // mediano y largo plazo: las dos partidas externas que no son reservas (columnas vecinas del cuadro).
      { k: 'otros_ext_tot', nombre: 'Otros act. externos', color: { claro: C.gris, oscuro: '#6E7A7D' } },
      { k: 'otras_ctas', nombre: 'Otras cuentas', color: { claro: C.tenue, oscuro: '#3A4549' } }
    ];
    var col = function (k) { return COMP.filter(function (c) { return c.k === k; })[0].color; };
    var PANEL = [
      ['rib', 'Reservas internacionales brutas'], ['credito_sp', 'Crédito al sector público'], ['credito_sf', 'Crédito al sist. financiero'],
      ['otros_ext_tot', 'Otros activos externos'], ['otras_ctas', 'Otras cuentas del activo']
    ];
    var estado = { rango: 'desde2010', idx: null };
    var activas = new Set(COMP.map(function (c) { return c.k; }));
    var S, M, K, si = 0, grafico;
    var bs = function (v) { return PM.mm(v, 'Bs'); };
    var parte = function (v, t) { return t > 0 ? v / t * 100 : 0; };
    // En el panel el porcentaje va en la misma línea del valor: con seis partidas, una línea más por
    // ítem dejaba la conclusión fuera de la vista.
    var conParte = function (txt, pc, de) {
      return txt + '<span style="font:600 .66rem/1 Inter,sans-serif;color:var(--muted);margin-left:8px">' + PM.pct(pc, 1) + ' ' + de + '</span>';
    };

    PM.cargar(['activo_bcb.json']).then(function (r) {
      S = r[0].series; M = r[0].metadata; estado.idx = S.length - 1;
      // Las seis partidas del balance suman el total (lo comprueba el scraper mes a mes)
      S.forEach(function (x) { x.otros_ext_tot = (x.aportes_oi || 0) + (x.otros_ext || 0); });
      K = S.map(function (x) { return x.date; });
      PM.botonera(document.getElementById('b-rango'), [['5a', '5 años'], ['desde2010', 'Desde 2010'], ['desde2000', 'Desde 2000'], ['todo', 'Todo']],
        estado.rango, function (v) { estado.rango = v; grafico.redibujar(); });
      PM.pastillas(document.getElementById('pastillas'),
        COMP.map(function (c) { return { k: c.k, nombre: c.nombre, color: c.color, forma: 'area' }; }),
        activas, function () { grafico.redibujar(); });
      cifras();
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      grafico.chart.on('click', function (p) { if (p.dataIndex != null) panel(si + p.dataIndex); });
      panel(estado.idx);
      PM.alCambiarTema(function () { cifras(); panel(estado.idx); });
      PM.preguntas(document.getElementById('preguntas'), PREGUNTAS);
      document.getElementById('fuente').innerHTML = 'Fuente: <a href="https://www.bcb.gob.bo/?q=content/sector-monetario" target="_blank" rel="noopener">BCB</a> · Elaboración: Centro de Estudios POPULI · Datos al: ' + PM.fecha(M.ultimo_dato);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    function cifras() {
      var u = S[S.length - 1], t = u.total_activo || 0, pRib = parte(u.rib, t), pSp = parte(u.credito_sp, t);
      // minilíneas: los últimos 24 meses del mismo saldo que muestra la cifra
      var serie = function (k) { return PM.ultimos(S.map(function (x) { return x[k]; }), 24); };
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: C.tinta, rotulo: 'Total activo', valor: bs(t), delta: '= Total pasivo', tono: 'neutro', serie: serie('total_activo') }) +
        PM.kpi({ color: col('rib'), rotulo: 'Reservas (RIB)', valor: bs(u.rib), delta: PM.pct(pRib, 1) + ' del activo', tono: pRib < 20 ? 'malo' : 'neutro', serie: serie('rib') }) +
        PM.kpi({ color: col('credito_sp'), rotulo: 'Créd. sector público', valor: bs(u.credito_sp), delta: PM.pct(pSp, 1) + ' del activo', tono: pSp > 60 ? 'malo' : 'neutro', serie: serie('credito_sp') }) +
        PM.kpi({ color: col('credito_sf'), rotulo: 'Créd. sist. financiero', valor: bs(u.credito_sf), delta: 'Bancos + entidades', tono: 'neutro', serie: serie('credito_sf') });
    }

    function opciones() {
      si = PM.desde(K, estado.rango);
      var V = S.slice(si), KV = K.slice(si), dk = PM.dk(), card = PM.var('--card') || '#fff';
      // El separador entre segmentos sólo cuando la barra da el ancho: con «desde 2010» son ~200
      // barras de 1-4 px y un borde de 1 px por lado se comería el dato. Densas, van sin hueco y en
      // modo `large`: un solo relleno por serie. Barra por barra, el antialiasing de los bordes
      // fraccionarios dejaba una costura clara cada pocos píxeles (rayas verticales); y un borde del
      // mismo color no la tapa, porque ECharts encoge la barra para meter el borde adentro.
      var denso = V.length > 90;
      var series = COMP.filter(function (c) { return activas.has(c.k); }).map(function (c) {
        return PM.barra(c.color, { extra: {
          name: c.nombre, stack: 'activo', barCategoryGap: denso ? '0%' : '20%',
          data: V.map(function (x) { return x[c.k] || 0; }),
          large: denso, largeThreshold: 1,
          itemStyle: denso ? {} : { opacity: dk ? 0.92 : 1, borderColor: card, borderWidth: 1 }
        } });
      });
      var el = document.getElementById('chart');
      return {
        grid: PM.grid(),
        xAxis: PM.ejeTiempo(KV, el, { boundaryGap: true }),
        yAxis: PM.ejeY({ unidad: 'MM Bs' }),
        tooltip: PM.tooltip(function (ps) {
          if (!ps.length) return '';
          var i = ps[0].dataIndex, x = V[i], t = x.total_activo || 0;
          panel(si + i);
          var h = PM.ttTitulo(PM.fecha(KV[i]), 'Millones de Bs · % del activo');
          ps.slice().reverse().forEach(function (p) {
            var c = COMP.filter(function (q) { return q.nombre === p.seriesName; })[0];
            if (!c) return;
            var v = x[c.k] || 0;
            h += PM.ttFila(c.color, c.nombre, PM.auto(v) + '<span style="color:rgba(255,255,255,.5);font-weight:500;margin-left:8px">' + PM.pct(parte(v, t), 1) + '</span>', 'area');
          });
          return h + PM.ttTotal('Total del activo', PM.auto(t));
        }, { axisPointer: PM.sombraEje() }),
        series: series
      };
    }

    function panel(i) {
      if (i == null || !S || !S[i]) return;
      estado.idx = i;
      var d = S[i], t = d.total_activo || 0, p = function (k) { return parte(d[k] || 0, t); };
      var sp = p('credito_sp'), rib = p('rib'), txt;
      if (sp > 70) txt = 'El crédito al sector público representa <strong>' + PM.pct(sp, 1) + '</strong> del activo: <strong>dominancia fiscal extrema</strong>. Las reservas apenas cubren <strong>' + PM.pct(rib, 1) + '</strong>. El balance del BCB está altamente deteriorado.';
      else if (sp > 50) txt = 'Crédito al SPNF en <strong>' + PM.pct(sp, 1) + '</strong> del activo, por encima de las reservas (' + PM.pct(rib, 1) + '). <strong>Señal de deterioro</strong> en la calidad del balance del BCB.';
      else if (rib > 50) txt = 'Las reservas representan <strong>' + PM.pct(rib, 1) + '</strong> del activo: balance <strong>saludable</strong>, con buen respaldo externo.';
      else txt = 'Balance del BCB con reservas en <strong>' + PM.pct(rib, 1) + '</strong> y crédito al SPNF en <strong>' + PM.pct(sp, 1) + '</strong>. Estructura equilibrada.';
      document.getElementById('panel-fecha').textContent = PM.fecha(d.date);
      document.getElementById('panel').innerHTML = PANEL.map(function (x) {
        var desc = x[0] === 'otros_ext_tot' ? 'Aportes a organismos internacionales ' + PM.auto(d.aportes_oi || 0) +
          ' · otros de mediano y largo plazo ' + PM.auto(d.otros_ext || 0) : null;
        return PM.pb(col(x[0]), x[1], conParte(bs(d[x[0]] || 0), p(x[0]), 'del activo'), desc);
      }).join('') + PM.ctx(txt);
    }

    var PREGUNTAS = [
      ['¿Qué muestra el activo del BCB?', 'El activo del banco central muestra <strong>en qué invierte</strong> los recursos: reservas internacionales (respaldo externo), crédito al gobierno (financiamiento fiscal) y crédito al sistema financiero. La composición revela la salud del balance.'],
      ['Reservas vs. crédito al gobierno', 'Un banco central sano tiene una alta proporción de <strong>reservas internacionales</strong> (activos de calidad). Cuando el <strong>crédito al sector público</strong> domina el activo, significa que el banco central financia al gobierno en lugar de mantener respaldo externo: señal de <strong>dominancia fiscal</strong>.'],
      ['Deterioro del balance', 'Si el crédito al SPNF crece mientras las RIB caen, el BCB está <strong>sustituyendo activos de calidad</strong> (divisas) por crédito al gobierno (activo de menor calidad). Este deterioro compromete la capacidad de defender el tipo de cambio.'],
      ['Activos buenos vs. malos', 'Un activo es <strong>«bueno»</strong> si proporciona solvencia y liquidez inmediata (reservas en divisas, oro monetario). Un activo es <strong>«malo»</strong> si es ilíquido, riesgoso o de dudoso valor (créditos irrecuperables al gobierno o empresas públicas deficitarias). La proporción entre ambos determina la solidez real del banco central.'],
      ['¿Cómo se agrupan las partidas?', 'El gráfico apila <strong>todas las partidas</strong> del balance que publica el BCB, así que la altura de cada barra es el activo total: reservas internacionales brutas, crédito al sector público, crédito al sistema financiero, <strong>otros activos externos</strong> (aportes a organismos internacionales y otros activos externos de mediano y largo plazo) y otras cuentas del activo. Antes de publicar se comprueba, mes a mes desde 1977, que la suma cierre con el total del cuadro.'],
      ['Dominancia fiscal', 'La <strong>dominancia fiscal</strong> ocurre cuando la política fiscal (decisiones de gasto e ingresos del gobierno) impone restricciones sobre la política monetaria, limitando la capacidad del BCB para controlar la inflación. Se manifiesta cuando el crédito al sector público domina el activo, convirtiendo al banco central en financiador del Estado en lugar de garante de la estabilidad monetaria.']
    ];
  })();
  </script>
</body>
</html>
